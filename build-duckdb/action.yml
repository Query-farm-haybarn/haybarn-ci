name: Build DuckDB
description: Build DuckDB, optionally run tests, and upload an artifact.
inputs:
  build-type:
     description: Name of the build subdirectory (release, debug, relassert, etc).
     default: "release"
  build:
     description: Build command
     required: true

  working-directory:
    description: Directory in which build/test/bundle commands are executed.
    default: "."

  test:
     description: Test command to run after build succeeded

  bundle:
     description: Bundle command to create an artifact

  upload-name:
    description: Uploaded artifact name
  upload-path:
    description: Output tarball path
    default: build/release-artifact.tar.gz

  cache:
    description: Whether to enable the vcpkg cache
    default: "true"
  cache-suffix:
     description: Suffix used to differentiate cache entry names.
  save-cache:
    description: Whether to save vcpkg cache.
    default: "true"

  vcpkg-commit:
    description: Git Commit ID used for vcpkg. Use "default" for the standardized version. Omit to skip vcpkg setup.

runs:
  using: composite
  steps:
    - name: Configure
      if: ${{ inputs.vcpkg-commit != '' }}
      id: configure
      shell: bash
      run: |
        set -eux -o pipefail
        if [[ "${{ inputs.vcpkg-commit }}" == "default" ]]; then
          # Release 2026.06.24
          resolved_vcpkg_commit="cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3"
        else
          resolved_vcpkg_commit="${{ inputs.vcpkg-commit }}"
        fi
        cache_path="${GITHUB_WORKSPACE}/vcpkg-cache"
        mkdir -p "${cache_path}"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${cache_path}" >> "$GITHUB_ENV"
        # Haybarn: keep the caller's VCPKG_BINARY_SOURCES (e.g. the shared HTTP
        # cache) instead of replacing it with the job-local folder. Captured once,
        # so a later step or a second use of this action in the job does not
        # read the value written below. It may carry a token: no xtrace here.
        set +x
        if [[ -z "${BUILD_DUCKDB_CALLER_BINARY_SOURCES+x}" ]]; then
          BUILD_DUCKDB_CALLER_BINARY_SOURCES="${VCPKG_BINARY_SOURCES:-}"
          echo "BUILD_DUCKDB_CALLER_BINARY_SOURCES=${BUILD_DUCKDB_CALLER_BINARY_SOURCES}" >> "$GITHUB_ENV"
        fi
        if [[ -n "${BUILD_DUCKDB_CALLER_BINARY_SOURCES}" ]]; then
          echo "Using the caller's VCPKG_BINARY_SOURCES; the actions/cache vcpkg folder is not used"
          files_cache="false"
        else
          echo "VCPKG_BINARY_SOURCES=clear;files,${cache_path},readwrite" >> "$GITHUB_ENV"
          files_cache="true"
        fi
        set -x
        resolved_vcpkg_root="${VCPKG_ROOT:-${GITHUB_WORKSPACE}/vcpkg}"
        vcpkg_last_commit_path="${resolved_vcpkg_root}/vcpkgLastBuiltCommitId"
        do_not_update="false"
        if [[ -f "${vcpkg_last_commit_path}" ]] && [[ "$(cat "${vcpkg_last_commit_path}")" == "${resolved_vcpkg_commit}" ]]; then
          do_not_update="true"
          echo "vcpkg marker matches requested commit; enabling doNotUpdateVcpkg"
        else
          echo "vcpkg marker missing/mismatched; allowing run-vcpkg update/bootstrap path"
        fi

        {
          echo "vcpkg_commit=${resolved_vcpkg_commit}"
          echo "vcpkg_root=${resolved_vcpkg_root}"
          echo "do_not_update_vcpkg=${do_not_update}"
          echo "files_cache=${files_cache}"
        } >> "$GITHUB_OUTPUT"


    - name: Restore vcpkg cache
      if: ${{ steps.configure.outputs.vcpkg_commit != '' && steps.configure.outputs.files_cache == 'true' && inputs.cache == 'true' }}
      id: vcpkg-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        # Save immutable snapshots while restoring the latest compatible prefix.
        key: vcpkg-v2-${{ runner.os }}-${{ inputs.build-type }}-${{ inputs.cache-suffix }}-${{ steps.configure.outputs.vcpkg_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vcpkg-v2-${{ runner.os }}-${{ inputs.build-type }}-${{ inputs.cache-suffix }}-${{ steps.configure.outputs.vcpkg_commit }}-

    - name: Setup vcpkg
      if: ${{ steps.configure.outputs.vcpkg_commit != '' }}
      uses: lukka/run-vcpkg@v11
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        vcpkgDirectory: ${{ steps.configure.outputs.vcpkg_root }}
        vcpkgGitCommitId: ${{ steps.configure.outputs.vcpkg_commit }}
        doNotUpdateVcpkg: ${{ steps.configure.outputs.do_not_update_vcpkg }}
        # Cache vcpkg binary to reduce impact of building from source on ARM.
        # TODO: caching logic is broken in run-vcpkg.
        # See: https://github.com/lukka/run-vcpkg/issues/243
        # doNotCache: ${{ (runner.arch == 'ARM' || runner.arch == 'ARM64') && 'false' || '' }}

    - name: Reset env
      if: ${{ steps.configure.outputs.vcpkg_commit != '' }}
      shell: bash
      run: |
        # Reset vcpkg env
        echo "::group::After run-vcpkg"
        # Binary/asset sources may carry a token; print them redacted.
        env | grep VCPKG | sed -E 's/(Bearer |auth=)[^,;]*/\1<redacted>/g'
        echo "::endgroup::"

        # github.workspace is a host path in container jobs.
        cache_path="${GITHUB_WORKSPACE}/vcpkg-cache"
        if [[ -n "${BUILD_DUCKDB_CALLER_BINARY_SOURCES:-}" ]]; then
          binary_sources="${BUILD_DUCKDB_CALLER_BINARY_SOURCES}"
        else
          binary_sources="clear;files,${cache_path},readwrite"
        fi
        {
          echo "VCPKG_TOOLCHAIN_PATH=${{ steps.configure.outputs.vcpkg_root }}/scripts/buildsystems/vcpkg.cmake";
          echo "VCPKG_DEFAULT_BINARY_CACHE=${cache_path}";
          echo "VCPKG_BINARY_SOURCES=${binary_sources}";
          echo USE_MERGED_VCPKG_MANIFEST=1;
        } >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build }}

    - name: Test
      if: ${{ inputs.test != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test }}

    - name: Save vcpkg cache
      if: ${{ steps.configure.outputs.vcpkg_commit != '' && steps.configure.outputs.files_cache == 'true' && inputs.cache == 'true' && inputs.save-cache == 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Bundle
      if: ${{ inputs.bundle != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.bundle }}

    - name: Upload
      if: ${{ inputs.upload-name != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.upload-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.upload-path }}
        if-no-files-found: error
